version: 2
builds:
  - binary: tndt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  disable: true

brews:
  - name: tiendanube-dev-tools
    homepage: "https://github.com/ScreenStaring/tiendanube-dev-tools"
    description: "Command-line program to assist with the development and maintenance of Tiendanube and Nuvemshop apps and stores"
    license: "MIT"
    repository:
      owner: ScreenStaring
      name: homebrew-tap
    directory: Formula
    commit_author:
      name: screenstaring-bot
      email: 224665351+screenstaring-bot@users.noreply.github.com
